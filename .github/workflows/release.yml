# Publica uma Release no GitHub quando uma etiqueta de versão (v1.2.3) é enviada:
# roda os testes, gera a extensão do Claude Desktop (.mcpb) e anexa o arquivo à Release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# A etiqueta precisa bater com __version__ em prospecta/__init__.py.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # necessário para criar a Release e anexar o arquivo
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Conferir a versão
        run: |
          VERSAO=$(python -c "import prospecta; print(prospecta.__version__)")
          if [ "v$VERSAO" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A etiqueta $GITHUB_REF_NAME não bate com a versão do código ($VERSAO)."
            exit 1
          fi
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python -m prospecta empacotar-extensao
      - name: Criar a Release com a extensão anexada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{{VERSAO}}/$VERSAO/g" .github/notas-da-versao.md > notas.md
          gh release create "$GITHUB_REF_NAME" "dist/prospecta-$VERSAO.mcpb" \
            --title "Prospecta $VERSAO" --notes-file notas.md --verify-tag
